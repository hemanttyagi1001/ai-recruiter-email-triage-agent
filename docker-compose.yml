# Local stack for the recruiter triage agent.
#
# `docker compose up -d` starts the AGENT ONLY. The bundled `db` service below
# is behind a profile and stays stopped unless you ask for it — see the note on
# that service for why.

services:
  # ---------------------------------------------------------------------------
  # The agent: a poll loop, not a server. No ports, no healthcheck endpoint.
  # ---------------------------------------------------------------------------
  agent:
    build: .
    container_name: ai-recruiter-email-triage-agent
    restart: unless-stopped

    # CONCEPT: reaching a database that is NOT part of this compose project.
    #   Inside a container, `localhost` is the container itself, so the
    #   DATABASE_URL in .env (which points at localhost:5432 for host-side CLI
    #   use) cannot work here. Two shapes of DOCKER_DATABASE_URL are valid, and
    #   which one is right depends on where the database lives:
    #     - `host.docker.internal:5432` — a pgvector container on the Docker
    #       HOST that publishes 5432. The local-development shape, and the
    #       reason `extra_hosts` below still exists.
    #     - `postgres18:5432` — the shared pgvector container on the VPS,
    #       reached over `postgress-net` (declared at the bottom of this file).
    #       That container publishes NO host port deliberately, so joining its
    #       network is the only way in. See D82.
    # WHY a separate env var instead of editing DATABASE_URL: the CLI, pytest
    # and alembic all still run on the host and need the localhost form. One
    # variable per audience beats one variable that is wrong for someone.
    # GOTCHA: DOCKER_DATABASE_URL lives in .env (gitignored) because it carries
    # the DB password. It is deliberately not written into this tracked file.
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env — see .env.example}
      # The host path in .env is relative to the repo; inside the container the
      # file lives under /app. Overriding here keeps .env correct for host-side
      # CLI use and correct for the container at the same time.
      # GOTCHA: the basename MUST be preserved. _pdf_part names the attachment
      # from the path, so mounting at a generic /app/resume.pdf makes every
      # recruiter receive "resume.pdf" — anonymous, and easy to lose in a
      # folder of identical filenames. Keeping the real filename is the whole
      # reason this interpolates RESUME_PATH instead of hardcoding a path.
      RESUME_PATH: /app/${RESUME_PATH:-hemant_tyagi_aiml_engineer.pdf}
    env_file:
      - .env

    # WHY host-gateway: Docker Desktop provides host.docker.internal
    # automatically, but plain Docker Engine on Linux does not. Declaring it
    # explicitly makes the same compose file work in both places.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # CONCEPT: joining a network this compose project does not own.
    #   `external: true` at the bottom means "this network already exists —
    #   attach to it, do not create it". Docker's embedded DNS then resolves
    #   the other containers on it by name, which is how `postgres18:5432`
    #   works with no published port and nothing exposed to the internet.
    # GOTCHA: external means exactly that. On a machine where the network does
    #   not exist yet, `docker compose up` fails with "network postgress-net
    #   declared as external, but could not be found" — it will NOT helpfully
    #   create one. Run `docker network create postgress-net` once per machine.
    #   On the VPS this is already done, and the database container is attached
    #   to it alongside its own project network.
    networks:
      - postgress-net

    # D69: pin public resolvers instead of inheriting Docker's embedded one.
    # WHY: Docker's built-in resolver at 127.0.0.11 forwards to whatever the
    # HOST's DNS was when the container started. On Docker Desktop the host
    # changes resolver constantly — laptop sleep/wake, Wi-Fi switch, VPN up or
    # down — and the container keeps forwarding to a server it can no longer
    # reach. The symptom is not a clean outage but intermittent
    # NameResolutionError on oauth2.googleapis.com and the Azure endpoint,
    # while the host itself resolves both fine.
    # GOTCHA: this is what dead-lettered 57 messages on 2026-09-01. The retry
    # classifier fix (D69, app/retry.py) makes those failures survivable; this
    # line is what stops most of them happening. Both are needed — retrying a
    # resolver that will never answer just fails five times instead of once.
    # ALTERNATIVE: leave DNS alone and rely on retries. Rejected: the outage
    # windows outlast the ~63s the backoff covers.
    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      # GOTCHA: token.json is mounted READ-WRITE on purpose. Access tokens
      # expire hourly and load_credentials() rewrites this file on every
      # refresh — mount it :ro and the agent authenticates fine for an hour,
      # then fails with a permission error that looks nothing like its cause.
      - ./token.json:/app/token.json
      # credentials.json is the OAuth client identity. Never rewritten, so it
      # stays read-only.
      - ./credentials.json:/app/credentials.json:ro
      # Your profile. Read-only; reloaded every cycle, so no restart needed.
      - ./candidate.toml:/app/candidate.toml:ro
      # The CV. Read-only, and read at send time rather than cached — replace
      # the file on the host and the next reply carries the new version.
      # GOTCHA: the "./" prefix is required. RESUME_PATH in .env is a bare
      # relative path (correct for host-side CLI use), and Compose reads a
      # source without a leading ./ or / as a NAMED VOLUME rather than a bind
      # mount — so the container would silently get an empty directory at
      # /app/resume.pdf instead of the CV, and every attachment would fail.
      - ./${RESUME_PATH:-hemant_tyagi_aiml_engineer.pdf}:/app/${RESUME_PATH:-hemant_tyagi_aiml_engineer.pdf}:ro
      # Logs land on the host so they outlive `docker rm`.
      - ./logs:/app/logs

    # WHY SIGTERM with a generous grace period: app/cli/watch.py catches
    # SIGTERM and finishes the message in flight rather than dying mid-graph.
    # Docker's default 10s would often escalate to SIGKILL during an LLM call.
    # Interruption is survivable — checkpointing sees to that — but a clean
    # stop leaves no partial run row to explain later.
    stop_signal: SIGTERM
    stop_grace_period: 60s

# This file declares no database service, and that is deliberate (D82).
#
# An earlier `db:` service behind a `bundled-db` profile was removed. It carried
# two live hazards that a profile flag does not defuse: it published 5432 with
# `- "5432:5432"`, which on a VPS means the open internet, and its password was
# a literal in this tracked file — in a public repo. Docker's port publishing
# writes its own iptables rules ahead of UFW, so "the firewall will catch it"
# was not true either. Anyone who ran `--profile bundled-db` on a server got an
# internet-facing Postgres with a published password and no warning.
#
# The database is now a container this project does not own, reached by name
# over `postgress-net`. Nothing about it is published to a host port.

networks:
  # CONCEPT: an external network is a shared bus between compose projects.
  #   Declaring it here attaches this project's containers to a network created
  #   outside it, so `postgres18` resolves by DNS from inside the agent. The
  #   database stays unpublished; the only things that can reach it are
  #   containers explicitly joined to this network.
  # GOTCHA: create it before the first `docker compose up` on any new machine —
  #   `docker network create postgress-net`. Compose will not create an
  #   external network for you; it fails with "declared as external, but could
  #   not be found".
  postgress-net:
    external: true
