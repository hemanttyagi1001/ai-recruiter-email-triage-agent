[project]
name = "recruiter-triage"
version = "0.0.1"
description = "Recruiter email triage agent — Phase 0 (read-only ingestion)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "beautifulsoup4>=4.12",
    "langgraph>=0.2",
    # Phase 2 additions
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Phase 4 additions — pgvector SQLAlchemy type + operator support
    "pgvector>=0.3",
    # Phase 7 — LangSmith tracing. Already arrives transitively via
    # langchain-core (a langgraph dependency), but app/observability imports it
    # directly, and a package you import is a package you declare: otherwise a
    # future langgraph release that drops the transitive edge breaks us at
    # runtime rather than at install time.
    "langsmith>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
